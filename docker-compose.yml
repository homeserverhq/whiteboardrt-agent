version: '3.8'

# Docker Compose for WhiteboardRT Agent Canvas
#
# Usage scenarios:
# 1. Canvas only:       docker-compose up canvas
# 2. MCP only:          docker-compose up mcp (requires canvas running elsewhere)
# 3. Both:              docker-compose --profile full up
#
# Most common: Run canvas locally, MCP via Claude Desktop config

services:
  # WhiteboardRT Agent canvas server - Visual UI and REST API
  canvas:
    build:
      context: .
      dockerfile: Dockerfile.canvas
    image: whiteboardrt-agent-canvas:latest
    container_name: whiteboardrt-agent-canvas
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOST=0.0.0.0
      - WHITEBOARD_RT_AGENT_PUBLIC_URL=${WHITEBOARD_RT_AGENT_PUBLIC_URL:-}
      - WHITEBOARD_RT_AGENT_STORAGE_URL=${WHITEBOARD_RT_AGENT_STORAGE_URL:-}
      - WHITEBOARD_RT_AGENT_PERSISTENCE=${WHITEBOARD_RT_AGENT_PERSISTENCE:-}
      - DEBUG=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - mcp-network

  # MCP server - Core product (typically run via Claude Desktop, not docker-compose)
  # This is here for testing or special deployment scenarios
  mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: whiteboardrt-agent-mcp:latest
    container_name: whiteboardrt-agent-mcp
    ports:
      - "3100:3100"
    environment:
      - NODE_ENV=production
      - EXPRESS_SERVER_URL=http://canvas:3000
      - WHITEBOARD_RT_AGENT_PUBLIC_URL=${WHITEBOARD_RT_AGENT_PUBLIC_URL:-}
      - ENABLE_CANVAS_SYNC=true
      - MCP_TRANSPORT=http
      - MCP_HOST=0.0.0.0
      - MCP_PORT=3100
      - LOG_LEVEL=info
      - DISABLED_TOOLS=get_canvas_screenshot
    depends_on:
      canvas:
        condition: service_healthy
    networks:
      - mcp-network
    profiles:
      - full

networks:
  mcp-network:
    driver: bridge
